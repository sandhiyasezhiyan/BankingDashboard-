
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Products Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Banking Products Dashboard</h1>
        <p>Manage all your banking products in one place.</p>

        <input
            type="text"
            id="searchInput"
            placeholder="Search banking products..."
        >

        <div class="filters">
            <button onclick="filterProducts('All')">All Products</button>
            <button onclick="filterProducts('Savings')">Savings</button>
            <button onclick="filterProducts('Credit Card')">Credit Cards</button>
            <button onclick="filterProducts('Loan')">Loans</button>
            <button onclick="filterProducts('Wealth')">Wealth</button>
        </div>

        <div class="product-container" id="productContainer">
            <!-- Product cards will be displayed here -->
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
